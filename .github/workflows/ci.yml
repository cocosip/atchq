name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    name: Build, test and quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and verify (tests + jacoco + spotless)
        # the surefire argLine in the root pom already carries the JDK 21 JVM opens
        # required by Chronicle; spotless:check and jacoco are bound to verify
        run: ./mvnw --batch-mode verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

      - name: Upload jacoco coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/**'
          retention-days: 7

  benchmarks:
    name: JMH benchmarks (manual trigger only)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run benchmarks
        # the benchmark main method appends the JDK 21 JVM opens to the forked JMH JVM itself
        run: |
          ./mvnw --batch-mode -pl latchq-benchmarks -am package
          java -jar latchq-benchmarks/target/latchq-benchmarks-*.jar

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: '**/target/benchmark-data/**'
          retention-days: 14
